[workspace]
resolver = "2"
members = [
    "hiraku_engine", 
    "hiraku_app", 
    "hiraku_script", 
    "hiraku_script_derive", 
    "hiraku_cli", 
    "hiraku_hdp", 
    "hiraku_errors", 
    "hiraku_video", 
    "hiraku_storage"
, "hiraku_media"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
event-listener = "5.4.2"
futures-lite = "2.6.1"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
rustc-hash = "2.1.3"
bumpalo = "3.20.3"
uuid = "1.26.0"

hiraku-engine = { path = "hiraku_engine" }
hiraku-errors = { path = "hiraku_errors" }
hiraku-hdp = { path = "hiraku_hdp" }
hiraku-script = { path = "hiraku_script" }
hiraku-storage = { path = "hiraku_storage" }
hiraku-video = { path = "hiraku_video" }

[workspace.dependencies.bevy]
version = "0.19.1"
default-features = false
features = ["3d", "audio", "ui"]

[workspace.dependencies.time]
version = "0.3.55"
features = ["wasm-bindgen"]

[workspace.dependencies.rand_pcg]
version = "0.10.2"
default-features = false

[profile.app-release]
inherits = "release"
strip = true
lto = true
panic = "abort"
codegen-units = 1
