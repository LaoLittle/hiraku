[workspace]
resolver = "2"
members = ["hiraku_engine", "hiraku_app"]
exclude = ["hiraku_app/examples/atri_3d_overlay_staticlib"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
futures-lite = "2.6.1"
prost = "0.14.4"
rand = "0.10.2"
rand_pcg = "0.10.2"
rhai = { version = "1.25.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
zip = "8.6.0"

[workspace.dependencies.bevy]
version = "0.19"
features = ["webp", "jpeg", "audio-all-formats"]

[profile.app-release]
inherits = "release"
strip = true
lto = true
panic = "abort"
codegen-units = 1
