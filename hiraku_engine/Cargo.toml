[package]
name = "hiraku-engine"
description = "Hiraku visual-novel engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
hiraku-codec.workspace = true
ogg = "0.9"
rodio = { version = "0.22", default-features = false }
hiraku-uastc.workspace = true
hiraku-sprite3d.workspace = true
bevy.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
event-listener.workspace = true
futures-lite.workspace = true
hiraku-hdp.workspace = true
hiraku-errors.workspace = true
hiraku-script.workspace = true
hiraku-ui.workspace = true
hiraku-text.workspace = true
hiraku-storage.workspace = true
hiraku-video.workspace = true
prost.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
blake3 = "1"
rand_pcg.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
mach2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Worker", "DedicatedWorkerGlobalScope", "MessageEvent", "ErrorEvent"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
futures-channel = "0.3"
gloo-timers = "0.3"
wgpu-types = { version = "30", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in", "glsl-in", "wgsl-out"] }
