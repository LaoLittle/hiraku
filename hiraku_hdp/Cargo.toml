[package]
name = "hiraku-hdp"
description = "Hiraku data package"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["zstd"]
zstd = ["dep:zstd"]
ruzstd = ["dep:ruzstd"]

[dependencies]
serde.workspace = true
rayon = "1.12.0"
thiserror.workspace = true
zerocopy = { version = "0.8.56", features = ["derive"] }

[dependencies.chacha20poly1305]
version = "0.11.0"
default-features = false

[dependencies.zstd]
version = "0.14.0"
optional = true
default-features = false

[dependencies.ruzstd]
version = "0.9.0"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.zstd]
version = "0.14.0"
features = ["zstdmt"]
